schema_version = 1

[structure]
source_root = "src/model_runtime"
ruff_rules = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
maximum_complexity = 10
maximum_branches = 12
maximum_returns = 6
maximum_statements = 50
maximum_arguments = 5
maximum_function_lines = 60
module_review_threshold = 600
allowed_findings = [
  { path = "src/model_runtime/packages/metadata.py", code = "PLR0913", function = "ModelMetadata.__init__", rationale = "The established five package-source inputs remain positional while configuration and search declarations form one explicit keyword-only all-or-none pair; hiding them in a shallow aggregate would weaken the construction contract." },
  { path = "src/model_runtime/runs/execution.py", code = "PLR0913", function = "execute_runs", rationale = "The public Run execution Interface has eight established inputs plus one explicit deployment-owned checkpoint-admission policy." },
  { path = "src/model_runtime/runs/experiment.py", code = "PLR0913", function = "ExperimentBase.execute_training_run", rationale = "The public keyword-compatible training interface has seven established arguments." },
]
reviewed_modules = [
  { path = "src/model_runtime/runs/execution.py", maximum_lines = 650, rationale = "Cohesive Run execution coordinator: plan admission, pending preset-scoped Experiment grouping, immutable handoff association, continuation binding, and ordered execution form one lifecycle; extracting the grouping would create a one-caller policy Module and split eager validation ordering." },
  { path = "src/model_runtime/inspection/shape_trace.py", maximum_lines = 730, rationale = "Re-reviewed cohesive shape-trace adapter: public trusted/sequential execution policy, trace orchestration, and immutable projection remain one boundary; generic tensor walking and runtime lifecycle already live in separate modules." },
  { path = "src/model_runtime/packages/runtime_values.py", maximum_lines = 710, rationale = "Re-reviewed cohesive Runtime Defaults admission owner: alias precedence, finite annotation-shape admission (including class-shaped typing rejection and transparent Annotated normalization), recursive value matching, exactly-once abstract configuration checks across overlapping union arms, and semantic constraints form one boundary; extracting any stage would create a one-caller policy Module and split exact error ordering." },
  { path = "src/model_runtime/runs/experiment.py", maximum_lines = 640, rationale = "Re-reviewed cohesive Lightning Integration Module spanning materialization, execution lifecycle, overridable progress/result hooks, and exact Run Artifact logger allocation; shared cross-Run outcome/retry state remains in the private outcome owner, while extracting these one-caller hooks would create shallow Modules." },
]

