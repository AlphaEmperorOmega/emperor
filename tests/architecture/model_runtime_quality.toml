schema_version = 1

[structure]
source_root = "src/model_runtime"
ruff_rules = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
maximum_complexity = 10
maximum_branches = 12
maximum_returns = 6
maximum_statements = 50
maximum_arguments = 5
maximum_function_lines = 60
module_review_threshold = 600
allowed_findings = [
  { path = "src/model_runtime/runs/execution.py", code = "PLR0913", function = "execute_runs", rationale = "The public keyword-compatible Run execution interface has eight established arguments." },
  { path = "src/model_runtime/runs/experiment.py", code = "PLR0913", function = "ExperimentBase.execute_training_run", rationale = "The public keyword-compatible training interface has seven established arguments." },
]
reviewed_modules = [
  { path = "src/model_runtime/inspection/shape_trace.py", maximum_lines = 717, rationale = "Cohesive shape-trace adapter; generic tensor walking and runtime lifecycle already live in separate modules." },
  { path = "src/model_runtime/runs/experiment.py", maximum_lines = 602, rationale = "Cohesive training adapter spanning materialization, runtime configuration, progress, Trainer execution, and artifacts; extracting only its tightly coupled phases would create a shallow back-reference seam." },
]

[coverage]
source = "model_runtime"
minimum_statement_percent = 88.0
minimum_branch_percent = 75.0
tests = [
  "tests.architecture.test_quality_configuration",
  "tests.contract.test_model_package_inspection_capabilities",
  "tests.contract.test_model_package_interface",
  "tests.integration.test_checkpoint_continuation",
  "tests.unit.test_cli_wire",
  "tests.unit.test_experiment_config_overrides",
  "tests.unit.test_inspection_graph_interface",
  "tests.unit.test_inspection_schema_interface",
  "tests.unit.test_inspection_shape_trace",
  "tests.unit.test_inspection_shape_trace_core",
  "tests.unit.test_model_catalog_cli",
  "tests.unit.test_model_runtime_quality_runner",
  "tests.unit.test_override_key_resolution",
  "tests.unit.test_package_cli_runs",
  "tests.unit.test_runs_acceptance",
  "tests.unit.test_runs_artifacts",
  "tests.unit.test_runs_checkpoint_validation",
  "tests.unit.test_runs_execution",
  "tests.unit.test_runs_parameter_preservation",
  "tests.unit.test_runs_planning",
  "tests.unit.test_runs_progress",
  "tests.unit.test_runs_search",
]

