min_version = "2025.7.12"

[tools]
python = "3.13"
node = "24"

[tasks.setup]
description = "Create the verified Emperor Python and Node environment"
usage = '''
flag "--profile <profile>" default="cpu" {
  choices "cpu" "cuda" "cuda-legacy"
}
'''
run = 'python tools/emperor_dev.py setup --profile "${usage_profile?}"'
run_windows = 'python tools/emperor_dev.py setup --profile "%usage_profile%"'

[tasks.dev]
description = "Set up and start the Workbench"
usage = '''
flag "--profile <profile>" default="cpu" {
  choices "cpu" "cuda" "cuda-legacy"
}
'''
run = 'python tools/emperor_dev.py dev --profile "${usage_profile?}"'
run_windows = 'python tools/emperor_dev.py dev --profile "%usage_profile%"'

[tasks."workbench:start"]
description = "Start the Workbench backend and frontend"
run = "python tools/emperor_dev.py workbench start"

[tasks."workbench:status"]
description = "Show validated Workbench service status"
run = "python tools/emperor_dev.py workbench status"

[tasks."workbench:stop"]
description = "Stop validated Workbench service process trees"
run = "python tools/emperor_dev.py workbench stop"

[tasks.experiment]
description = "List, inspect, or train a Model Package"
raw = true
run = "python tools/emperor_dev.py experiment"

[tasks.test]
description = "Run Emperor's unittest suite"
raw = true
run = "python tools/emperor_dev.py test"

[tasks."test:emperor-interfaces"]
description = "Run Emperor package Interface and architecture contracts"
run = "PYTHONPATH=src python -m unittest tests.architecture.test_emperor_interfaces tests.contract.test_emperor_public_interfaces"

[tasks."test:family"]
description = "Run focused tests for one Emperor family"
raw = true
run = "python tools/emperor_test_family.py tests"

[tasks."test:family-coverage"]
description = "Require complete statement and branch coverage for one Emperor family"
raw = true
run = "python tools/emperor_test_family.py coverage"

[tasks."test:family-mutation"]
description = "Run mutation testing for one Emperor family"
raw = true
run = "python tools/emperor_test_family.py mutation"

[tasks."test:model-runtime"]
description = "Run focused Model Runtime tests"
raw = true
run = "python tools/emperor_dev.py python -- tools/model_runtime_quality.py tests"

[tasks."test:model-runtime-coverage"]
description = "Enforce Model Runtime statement and branch coverage floors"
raw = true
run = "python tools/emperor_dev.py python -- tools/model_runtime_quality.py coverage"

[tasks."test:model-runtime-structure"]
description = "Enforce Model Runtime structural thresholds and reviewed ceilings"
raw = true
run = "python tools/emperor_dev.py python -- tools/model_runtime_quality.py structure"

[tasks."test:model-runtime-mutation"]
description = "Run critical Model Runtime mutation testing"
raw = true
run = "python tools/emperor_dev.py python -- tools/model_runtime_quality.py mutation"

[tasks."test:model-runtime-types"]
description = "Run pinned strict type checking for Model Runtime"
raw = true
run = "npm run typecheck:model-runtime"

[tasks."test:model-packages-types"]
description = "Run pinned strict type checking for Model Packages"
raw = true
run = "npm run typecheck:model-packages"

[tasks."test:attention"]
description = "Run the attention unittest suite"
run = "python tools/emperor_test_family.py tests attention"

[tasks."test:attention-coverage"]
description = "Require complete statement and branch coverage for emperor.attention"
run = "python tools/emperor_test_family.py coverage attention"

[tasks."test:attention-mutation"]
description = "Run attention mutation testing (Linux or WSL only)"
run = "python tools/emperor_test_family.py mutation attention"

[tasks."logs:archive"]
description = "Create a portable Workbench log archive"
raw = true
run = "python tools/emperor_dev.py logs:archive"
